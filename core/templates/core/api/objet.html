{% extends "core/api/layout.html" %}

{% block main %}
<h1>{{objet.name}}</h1>
<ol>
    {% for item in objet.content %}
    <li>
        <h2>{{item.name.capitalize}} 
            <i>({{item.nature.capitalize}}, {{item.type}})</i> : 
        </h2>
        <p>Aucune description</p>
    </li>
    {% empty %}
        {{message}}
    {% endfor %}
</ol>
{% endblock %}
