{% load static%}

<!DOCTYPE html>

<html lang="en">
    <head>
        <title>API - Objets</title>
    </head>
    <body>
        <header>
            <h1> Mon API</h1>
            <nav>
                <ul>
                    <li>
                        <a href="{% url 'core:api_index' %}"> Tous les objets</a>
                    </li>
                    {% for filter in filters %}
                    <li>
                        <a href="{% url 'core:objet' filter.location %}">{{filter.name}}</a>
                    </li>
                    {% endfor %}
                </ul>
            </nav>
        </header>
        <main>
         {% block main %}
         {% endblock %}
        </main>  
    </body>
</html>
